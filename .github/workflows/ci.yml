name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extended:
        description: Run Docker, ACME, security and production browser checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check source, Go and frontend
        run: make check
      - name: Extended backend checks
        if: github.event_name == 'workflow_dispatch' && inputs.extended
        run: make security integration
      - name: Build backend and install test browser
        if: github.event_name == 'workflow_dispatch' && inputs.extended
        run: |
          python3 scripts/build.py
          cd web
          npx playwright install --with-deps chromium
      - name: Production browser regression
        if: github.event_name == 'workflow_dispatch' && inputs.extended
        run: python3 scripts/test-web.py
      - name: Preserve browser failure evidence
        if: failure() && hashFiles('web/test-results/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-evidence
          path: web/test-results/
          retention-days: 7
