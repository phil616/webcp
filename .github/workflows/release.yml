name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  package:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate tag and record source identity
        env:
          SOURCE_REF_TYPE: ${{ github.ref_type }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          if os.environ['SOURCE_REF_TYPE'] == 'tag' and os.environ['SOURCE_REF_NAME'] != 'v' + version:
              raise SystemExit('Release tag does not match VERSION')
          PY
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build Linux archives and corresponding source
        env:
          WEBCP_BUILD_COMMIT: ${{ github.sha }}
        run: make release
      - name: Verify archives and rebuild corresponding source
        run: python3 scripts/verify-release.py dist/releases --source-rebuild
      - name: Upload reviewable release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webcp-release-packages
          path: dist/releases/
          if-no-files-found: error
          retention-days: 30
